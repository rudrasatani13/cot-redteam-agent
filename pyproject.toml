[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cot-redteam-agent"
version = "0.1.0"
description = "Automated Chain-of-Thought Red Teaming Agent"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Rudra Satani"}]

dependencies = [
    "httpx>=0.25",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "scipy>=1.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.1",
    "ruff>=0.1",
]
dashboard = [
    "streamlit>=1.28",
    "plotly>=5.18",
    "pandas>=2.0",
]
tracking = [
    "mlflow>=2.8",
    "wandb>=0.16",
]

[project.scripts]
cot-redteam = "cot_redteam.cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["cot_redteam*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]