[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cot-redteam-agent"
version = "0.3.0"
description = "Automated Chain-of-Thought Red Teaming Agent"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Rudra Satani"}]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "httpx>=0.25",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "scipy>=1.11",
]

[project.urls]
Homepage = "https://github.com/rudrasatani13/cot-redteam-agent"
Source = "https://github.com/rudrasatani13/cot-redteam-agent"
Issues = "https://github.com/rudrasatani13/cot-redteam-agent/issues"
Changelog = "https://github.com/rudrasatani13/cot-redteam-agent/blob/main/CHANGELOG.md"
Documentation = "https://github.com/rudrasatani13/cot-redteam-agent#readme"
Security = "https://github.com/rudrasatani13/cot-redteam-agent/security/policy"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.1",
    "ruff>=0.1",
    "mypy>=1.8",
    "build>=1.0",
    "pip-tools>=7.0",
    "types-PyYAML>=6.0",
]

[project.scripts]
cot-redteam = "cot_redteam.cli.main:entrypoint"

[project.entry-points."cot_redteam.attacks"]
# third-party packages register here

[project.entry-points."cot_redteam.monitors"]
# third-party packages register here

[tool.setuptools.packages.find]
where = ["."]
include = ["cot_redteam*"]

[tool.setuptools.package-data]
cot_redteam = ["py.typed", "eval/datasets/*.jsonl", "data/*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
pretty = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
    "cot_redteam.core.*",
    "cot_redteam.providers.*",
    "cot_redteam.eval.*",
    "cot_redteam.storage.*",
    "cot_redteam.reporting.*",
    "cot_redteam.plugins.*",
    "cot_redteam.api",
]
disallow_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["cot_redteam"]
branch = true

[tool.coverage.report]
fail_under = 75
show_missing = true
skip_empty = true
