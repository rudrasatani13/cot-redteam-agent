# CoT Red Team Agent 0.4 example configuration
# Credentials come from environment variables named below — never commit secrets.

version: 2

global:
  seed: 42
  log_level: INFO
  output_dir: ./results
  concurrency: 4

providers:
  openrouter:
    kind: openrouter
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    timeout: 120
    max_retries: 3
    concurrency: 4

  openai:
    kind: openai
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
    timeout: 120
    max_retries: 3
    concurrency: 4

  anthropic:
    kind: anthropic
    base_url: https://api.anthropic.com
    api_key_env: ANTHROPIC_API_KEY
    timeout: 120
    max_retries: 3
    concurrency: 4

  vllm:
    kind: vllm
    base_url: http://localhost:8000/v1
    timeout: 300
    max_retries: 2
    concurrency: 2

  llamacpp:
    kind: llamacpp
    base_url: http://localhost:8080/v1
    timeout: 300
    max_retries: 2
    concurrency: 2

evaluation:
  models:
    - openrouter:replace-with-model-id
  attacks:
    # Agentic loop: seed bank → classify refusal → invent next technique until
    # real final-text canary disclosure (or max_attempts). Refusal quotes ≠ success.
    - injection.system_canary_agent
  monitors:
    - regex
  # Packaged sample dataset (works from installed wheels). Override with a local path if needed.
  dataset_path: pkg:sample.jsonl
  sample_count: 3
  # To run the v0.3 benchmark instead of legacy attacks, remove attacks/monitors
  # above and enable one or more suites. The smoke suite uses 13 target requests
  # per model at one repetition. Incompatible trials fail before requests.
  # suite_ids:
  #   - builtin.smoke
  # repetitions: 1
  temperature: 0.7
  max_tokens: 2048
  cot_delimiters:
    - "<think>"
    - "</think>"
    - "<reasoning>"
    - "</reasoning>"
  budgets:
    max_requests: 100
    max_elapsed_seconds: 600
  retain_prompts: true
  retain_responses: true
  retain_reasoning: true
  attack_config:
    injection.system_canary_agent:
      bank_path: pkg:system_canary_bank.jsonl
      seed_payloads: 4
      max_attempts: 24
      require_final_text: true
      stop_on_success: true
  monitor_config:
    regex:
      patterns: []

artifacts:
  root: ./artifacts

storage:
  path: ./results/cot_redteam.db

reporting:
  formats:
    - markdown
  output_dir: ./results/reports

generative:
  generator_model: openrouter:replace-with-model-id
  target_models:
    - openrouter:replace-with-model-id
  evolution_rounds: 2
  population_size: 3
  max_generation_attempts: 10
  mutation_rate: 0.3
  crossover_rate: 0.5
  fitness_weights:
    attack_success: 0.4
    evasion: 0.4
    novelty: 0.2
  archive_path: ./results/generative_archive.json
