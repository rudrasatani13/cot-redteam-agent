name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  primary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install hash-locked dependencies
        run: |
          python -m pip install -U pip
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-deps -e .
      - name: Ruff
        run: |
          python -m ruff format --check .
          python -m ruff check .
      - name: Mypy
        run: python -m mypy cot_redteam
      - name: Tests + coverage
        run: |
          python -m pytest --cov=cot_redteam --cov-report=term-missing --cov-report=json
          python scripts/check_critical_coverage.py coverage.json
      - name: Offline agent scan / replay / regression
        run: |
          SMOKE="$(mktemp -d)"
          cp cot_redteam/data/agent_security.example.yaml "$SMOKE/agent.yaml"
          mkdir -p "$SMOKE/security_regressions"
          cp tests/fixtures/security_regressions/* "$SMOKE/security_regressions/"
          cd "$SMOKE"
          # A vulnerable fixture proves an exploit: expect exit 1.
          cot-redteam agent scan --config agent.yaml >/tmp/scan.out 2>&1
          SCAN=$?
          if [ "$SCAN" -ne 1 ]; then echo "agent scan expected exit 1, got $SCAN"; cat /tmp/scan.out; exit 1; fi
          # Exact replay of a known-vulnerable fixture must reproduce: exit 1.
          cot-redteam replay security_regressions/exploit-indirect-injection.json >/tmp/replay.out 2>&1
          REPLAY=$?
          if [ "$REPLAY" -ne 1 ]; then echo "replay expected exit 1, got $REPLAY"; cat /tmp/replay.out; exit 1; fi
          # Patched regression target must hold: exit 0.
          cot-redteam regress --suite security_regressions >/tmp/regress.out 2>&1
          REGRESS=$?
          if [ "$REGRESS" -ne 0 ]; then echo "regress expected exit 0, got $REGRESS"; cat /tmp/regress.out; exit 1; fi
      - name: Build
        run: python -m build

  matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install from package metadata
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q

  wheel-smoke:
    runs-on: ubuntu-latest
    needs: primary
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and install wheel
        run: |
          python -m pip install -U pip build
          python -m pip install -e ".[dev]"
          rm -rf dist
          python -m build
          WHEEL="$(ls -1 dist/cot_redteam_agent-*-py3-none-any.whl | sort -V | tail -1)"
          test -n "$WHEEL"
          echo "Installing $WHEEL"
          python -m pip install --force-reinstall --no-deps "$WHEEL"
          cot-redteam --help
          SMOKE="$(mktemp -d)"
          cd "$SMOKE"
          cot-redteam init --path config.yaml
          # validate without real remote keys for local providers only would fail;
          # ensure packaged dataset marker resolves by loading config
          python - <<'PY'
          from importlib.resources import files

          from cot_redteam.core.config import load_config
          from cot_redteam.eval.dataset import Dataset
          from cot_redteam.benchmark.corpora import load_builtin_suite
          from cot_redteam.attacks.injection.payload_bank import load_payload_bank

          cfg = load_config("config.yaml")
          assert cfg.evaluation.dataset_path.startswith("pkg:") or "sample" in cfg.evaluation.dataset_path
          ds = Dataset.load_jsonl(cfg.evaluation.dataset_path)
          assert len(ds.samples) > 0
          print("wheel dataset ok", len(ds.samples))
          assert len(load_builtin_suite("builtin.smoke").scenarios) == 12
          assert len(load_builtin_suite("builtin.core").scenarios) == 56
          print("wheel benchmark suites ok")
          bank = load_payload_bank()
          assert len(bank) >= 10
          assert files("cot_redteam.attacks.injection").joinpath(
              "system_canary_bank.jsonl"
          ).is_file()
          print("wheel payload bank ok", len(bank))
          assert files("cot_redteam.data").joinpath(
              "agent_security.example.yaml"
          ).is_file()
          print("wheel agent example config ok")
          PY
          # Offline agent flow from the installed wheel (no credentials).
          mkdir -p "$SMOKE/security_regressions"
          cp "$GITHUB_WORKSPACE"/tests/fixtures/security_regressions/* "$SMOKE/security_regressions/"
          cp "$GITHUB_WORKSPACE"/cot_redteam/data/agent_security.example.yaml "$SMOKE/agent.yaml"
          cd "$SMOKE"
          cot-redteam agent scan --config agent.yaml >/tmp/wheel-scan.out 2>&1
          SCAN=$?
          if [ "$SCAN" -ne 1 ]; then echo "wheel agent scan expected exit 1, got $SCAN"; cat /tmp/wheel-scan.out; exit 1; fi
          cot-redteam replay security_regressions/exploit-indirect-injection.json >/tmp/wheel-replay.out 2>&1
          REPLAY=$?
          if [ "$REPLAY" -ne 1 ]; then echo "wheel replay expected exit 1, got $REPLAY"; cat /tmp/wheel-replay.out; exit 1; fi
          cot-redteam regress --suite security_regressions >/tmp/wheel-regress.out 2>&1
          REGRESS=$?
          if [ "$REGRESS" -ne 0 ]; then echo "wheel regress expected exit 0, got $REGRESS"; cat /tmp/wheel-regress.out; exit 1; fi
          echo "wheel offline agent flow ok"
