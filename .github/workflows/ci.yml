name: ci

on:
  push:
  pull_request:

jobs:
  primary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (lock if present else editable)
        run: |
          python -m pip install -U pip
          if [ -f requirements-dev.lock ]; then
            python -m pip install --require-hashes -r requirements-dev.lock || python -m pip install -e ".[dev]"
          else
            python -m pip install -e ".[dev]"
          fi
      - name: Ruff
        run: |
          python -m ruff format --check .
          python -m ruff check .
      - name: Mypy
        run: python -m mypy cot_redteam
      - name: Tests + coverage
        run: |
          python -m pytest --cov=cot_redteam --cov-report=term-missing --cov-report=json
          python scripts/check_critical_coverage.py coverage.json
      - name: Build
        run: python -m build

  matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install from package metadata
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q

  wheel-smoke:
    runs-on: ubuntu-latest
    needs: primary
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and install wheel
        run: |
          python -m pip install -U pip build
          python -m pip install -e ".[dev]"
          python -m build
          python -m pip install --force-reinstall --no-deps dist/cot_redteam_agent-0.2.0-py3-none-any.whl
          cot-redteam --help
