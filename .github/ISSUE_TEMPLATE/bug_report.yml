name: Bug report
description: Report a reproducible defect in CoT Red Team Agent
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not report vulnerabilities or include secrets here. Use the private reporting link in SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Version
      description: Package version or Git commit.
      placeholder: 0.2.0
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python and operating system
      placeholder: Python 3.12.4 on Ubuntu 24.04
    validations:
      required: true
  - type: dropdown
    id: interface
    attributes:
      label: Interface
      options:
        - CLI
        - Python API
        - Provider
        - Attack or monitor plugin
        - Storage or reporting
        - Packaging or installation
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include commands or redacted configuration. Never include credentials or sensitive model data.
      render: shell
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted logs
      description: Remove secrets, provider identifiers, private prompts, and responses.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Safety checks
      options:
        - label: I removed credentials and sensitive evaluation data.
          required: true
        - label: This is not a vulnerability report.
          required: true
